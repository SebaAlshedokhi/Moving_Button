
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .wrap {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    background: #0d1117;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    direction: rtl;
    overflow: hidden;
    position: relative;
  }
  .logo-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2rem;
    z-index: 2;
  }
  .logo-text { font-size: 13px; color: #a8b2c1; }
  .card {
    background: #161b22;
    border: 0.5px solid #30363d;
    border-radius: 18px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 500px;
    text-align: center;
    z-index: 2;
    position: relative;
  }
  .question {
    font-size: 20px;
    font-weight: 700;
    color: #e6edf3;
    margin-bottom: 0.4rem;
    line-height: 1.5;
  }
  .subtitle { font-size: 13px; color: #6e7681; margin-bottom: 2rem; }
  .options { display: flex; flex-direction: column; gap: 14px; }
  .opt-btn {
    position: fixed;
    border-radius: 12px;
    border: 1.5px solid #30363d;
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 14px 20px;
    cursor: pointer;
    text-align: right;
    direction: rtl;
    width: 200px;
    transition: background 0.15s;
    z-index: 999;
  }
  .opt-btn:hover { background: #1a1a2a; }
  .real-btn {
    position: static !important;
    width: 100%;
    border-radius: 12px;
    border: 1.5px solid #a371f7;
    background: #161b22;
    color: #e6edf3;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 14px 20px;
    cursor: pointer;
    text-align: right;
    direction: rtl;
    transition: background 0.15s, transform 0.1s;
  }
  .real-btn:hover { background: #1f1540; border-color: #d2a8ff; }
  .real-btn:active { transform: scale(0.98); }
  .figma-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 1.5rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .d1{background:#1abcfe;} .d2{background:#ff7262;} .d3{background:#0acf83;} .d4{background:#a259ff;} .d5{background:#f24e1e;}
  .thankyou {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 1rem 0;
  }
  .thankyou-title { font-size: 22px; font-weight: 700; color: #e6edf3; }
  .thankyou-sub { font-size: 14px; color: #8b949e; line-height: 1.8; text-align: center; }
  .team-names { margin-top: 0.5rem; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .team-chip {
    background: #1a1030;
    border: 1px solid #a371f740;
    border-radius: 20px;
    padding: 5px 16px;
    font-size: 13px;
    color: #d2a8ff;
    font-weight: 500;
  }
  .placeholder-row {
    height: 52px;
    border-radius: 12px;
    border: 1.5px dashed #30363d30;
    background: transparent;
  }
</style>

<div class="wrap" id="wrap">
  <div class="logo-line">
    <svg width="28" height="42" viewBox="0 0 38 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 28C19 22.477 23.477 18 29 18C34.523 18 39 22.477 39 28C39 33.523 34.523 38 29 38C23.477 38 19 33.523 19 28Z" fill="#1ABCFE"/>
      <path d="M0 28C0 22.477 4.477 18 10 18H19V38H10C4.477 38 0 33.523 0 28Z" fill="#0ACF83"/>
      <path d="M0 10C0 4.477 4.477 0 10 0H19V20H10C4.477 20 0 15.523 0 10Z" fill="#FF7262"/>
      <path d="M19 0H28C33.523 0 38 4.477 38 10C38 15.523 33.523 20 28 20H19V0Z" fill="#F24E1E"/>
      <path d="M0 46C0 40.477 4.477 36 10 36H19V46C19 51.523 14.523 56 9.5 56C4.253 56 0 51.523 0 46Z" fill="#A259FF"/>
    </svg>
    <span class="logo-text">ورشة UI/UX & Figma</span>
  </div>

  <div class="card" id="survey-card">
    <div class="figma-dots">
      <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div><div class="dot d5"></div>
    </div>
    <div class="question">ما مدى رضاك عن الورشة؟</div>
    <p class="subtitle">اختر إجابتك من الخيارات أدناه</p>

    <div class="options" id="options-list">
      <div class="placeholder-row" id="ph1"></div>
      <div class="placeholder-row" id="ph2"></div>
      <div class="placeholder-row" id="ph3"></div>
      <button class="real-btn" onclick="submitAnswer()">
        أحلى سشن وأحلى ورشة والتقديم مثالي ولا غلطة وماكنت أتخيل ورشة عمل بهالحمال ✨
      </button>
    </div>
  </div>

  <div class="card thankyou" id="thankyou-card">
    <div style="font-size:48px; margin-bottom:0.5rem;">🎉</div>
    <div class="thankyou-title">شكرًا لكم!</div>
    <p class="thankyou-sub">نسعد بمشاركتكم وآرائكم الثمينة<br>يسعدنا نلتقيكم في ورش قادمة 🚀</p>
    <div style="margin-top:1rem; font-size:13px; color:#6e7681;">مع تحيات فريق العمل</div>
    <div class="team-names">
      <span class="team-chip">Seba</span>
      <span class="team-chip">Shatha</span>
      <span class="team-chip">Aljawharah</span>
    </div>
    <div class="figma-dots" style="margin-top:1.5rem; margin-bottom:0;">
      <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div><div class="dot d5"></div>
    </div>
  </div>
</div>

<script>
const labels = ['لا بأس', 'جيد نوعًا ما', 'ما استفدت'];
const escBtns = [];

function randomPos() {
  const margin = 60;
  const W = window.innerWidth;
  const H = window.innerHeight;
  return {
    x: margin + Math.random() * (W - margin * 2 - 220),
    y: margin + Math.random() * (H - margin * 2 - 60)
  };
}

function placeBtn(btn) {
  const p = randomPos();
  btn.style.left = p.x + 'px';
  btn.style.top = p.y + 'px';
}

function moveAway(btn, e) {
  placeBtn(btn);
}

labels.forEach((label, i) => {
  const btn = document.createElement('button');
  btn.className = 'opt-btn';
  btn.textContent = label;
  const p = randomPos();
  btn.style.left = p.x + 'px';
  btn.style.top = p.y + 'px';
  btn.addEventListener('mouseenter', () => moveAway(btn));
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveAway(btn); }, {passive: false});
  document.body.appendChild(btn);
  escBtns.push(btn);
});

function submitAnswer() {
  escBtns.forEach(b => b.style.display = 'none');
  document.getElementById('survey-card').style.display = 'none';
  const ty = document.getElementById('thankyou-card');
  ty.style.display = 'flex';
}
</script>
