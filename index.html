<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>استبيان ورشة UI/UX</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Cairo',sans-serif;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at top right,#312e81 0%,transparent 30%),
    radial-gradient(circle at bottom left,#0f766e 0%,transparent 25%),
    linear-gradient(160deg,#050816,#0b1020,#111827);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  color:white;
}

.container{
  width:100%;
  max-width:390px;
  position:relative;
}

.card{
  background:rgba(17,24,39,.82);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:30px;
  padding:28px 22px;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 0 40px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.glow{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  filter:blur(60px);
  opacity:.25;
}

.glow.one{
  background:#a259ff;
  top:-70px;
  right:-60px;
}

.glow.two{
  background:#1abcfe;
  bottom:-70px;
  left:-60px;
}

.logo{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.logo .dots{
  display:flex;
  gap:8px;
}

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
}

.d1{background:#f24e1e;}
.d2{background:#ff7262;}
.d3{background:#a259ff;}
.d4{background:#1abcfe;}
.d5{background:#0acf83;}

.title{
  text-align:center;
  font-size:28px;
  font-weight:800;
  line-height:1.5;
  margin-bottom:12px;
}

.subtitle{
  text-align:center;
  color:#b9c1d9;
  font-size:14px;
  line-height:1.8;
  margin-bottom:26px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:14px;
  position:relative;
}

.btn{
  width:100%;
  border:none;
  border-radius:18px;
  padding:16px 18px;
  font-family:'Cairo',sans-serif;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.fake{
  position:absolute;
  width:100%;
  left:0;
  background:#0f172a;
  color:#dce3f8;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.fake:hover{
  transform:scale(1.02);
}

.real{
  position:relative;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  color:white;
  box-shadow:0 12px 25px rgba(124,58,237,.35);
}

.real:active{
  transform:scale(.98);
}

#thanks{
  display:none;
  text-align:center;
}

.success{
  width:150px;
  height:150px;
  border-radius:50%;
  margin:24px auto 18px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  font-weight:800;
  background:
    conic-gradient(#8b5cf6 0deg,#06b6d4 180deg,#22c55e 360deg);
  position:relative;
}

.success::before{
  content:"";
  position:absolute;
  inset:12px;
  background:#0f172a;
  border-radius:50%;
}

.success span{
  position:relative;
  z-index:2;
}

.thanks-title{
  font-size:32px;
  font-weight:800;
  margin-bottom:10px;
}

.team{
  color:#c6d0ea;
  line-height:2;
  margin-top:14px;
  font-size:16px;
}

.credit{
  margin-top:10px;
  color:#8fa0c7;
}

@media (max-width:420px){

  .title{
    font-size:24px;
  }

  .btn{
    font-size:14px;
    padding:15px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="card" id="survey">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="logo">
      <div class="dots">
        <div class="dot d1"></div>
        <div class="dot d2"></div>
        <div class="dot d3"></div>
        <div class="dot d4"></div>
        <div class="dot d5"></div>
      </div>
    </div>

    <div class="title">
      ما مدى رضاك عن الورشة ؟
    </div>

    <div class="subtitle">
      ورشة UI/UX وبرنامج Figma ✨
    </div>

    <div class="options" id="optionsBox">

      <button class="btn fake" id="b1">
        لا بأس
      </button>

      <button class="btn fake" id="b2">
        جيد نوعًا ما
      </button>

      <button class="btn fake" id="b3">
        ما استفدت
      </button>

      <button class="btn real" id="realBtn">
        أحلى سشن وأحلى ورشة والتقديم مثالي ولا غلطة وماكنت أتخيل ورشة عمل بهالجمال ✨
      </button>

    </div>

  </div>


  <div class="card" id="thanks">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="thanks-title">
      شكرًا لكم 💜
    </div>

    <div class="credit">
      مع تحيات فريق العمل:
    </div>

    <div class="team">
      Seba<br>
      Shatha<br>
      Aljawharah
    </div>

    <div class="success">
      <span>100%<br>راضي</span>
    </div>

  </div>

</div>


<script>

const fakeButtons = document.querySelectorAll('.fake');
const container = document.getElementById('optionsBox');

function moveButton(button){

  const containerRect = container.getBoundingClientRect();

  const maxX = container.clientWidth - button.offsetWidth;
  const maxY = container.clientHeight - button.offsetHeight - 80;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  button.style.left = randomX + 'px';
  button.style.top = randomY + 'px';
}

fakeButtons.forEach(btn => {

  btn.addEventListener('mouseenter', () => {
    moveButton(btn);
  });

  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveButton(btn);
  }, { passive:false });

});

document.getElementById('realBtn').addEventListener('click', () => {

  document.getElementById('survey').style.display = 'none';
  document.getElementById('thanks').style.display = 'block';

});

</script>

</body>
</html>
