<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>استبيان ورشة UI/UX</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Cairo',sans-serif;
      min-height:100vh;
      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      background:
        radial-gradient(circle at top right,#312e81 0%,transparent 30%),
        radial-gradient(circle at bottom left,#0f766e 0%,transparent 25%),
        linear-gradient(160deg,#050816,#0b1020,#111827);

      color:white;
    }

    .container{
      width:96vw;
      max-width:520px;
    }

    .card{
      position:relative;
      overflow:hidden;

      width:100%;
      min-height:92vh;

      border-radius:34px;

      padding:26px 20px;

      background:rgba(17,24,39,.84);
      backdrop-filter:blur(14px);

      border:1px solid rgba(255,255,255,.08);

      box-shadow:
        0 0 50px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    .glow{
      position:absolute;
      width:240px;
      height:240px;
      border-radius:50%;
      filter:blur(70px);
      opacity:.25;
      pointer-events:none;
    }

    .one{background:#a259ff; top:-100px; right:-90px;}
    .two{background:#1abcfe; bottom:-100px; left:-90px;}

    .title{
      text-align:center;
      font-size:31px;
      font-weight:800;
      margin-bottom:10px;
      position:relative;
      z-index:5;
    }

    .subtitle{
      text-align:center;
      color:#c7d2fe;
      font-size:15px;
      margin-bottom:28px;
      position:relative;
      z-index:5;
    }

    .options{
      position:relative;
      width:100%;
      height:72vh;
      z-index:5;
    }

    .btn{
      position:absolute;

      border:none;
      border-radius:18px;
      padding:13px 16px;

      font-family:'Cairo',sans-serif;
      font-size:14px;
      font-weight:700;

      cursor:pointer;

      background:#111827;
      color:#eef2ff;

      border:1px solid rgba(255,255,255,.08);

      box-shadow:0 10px 25px rgba(0,0,0,.25);

      transition:left .05s linear, top .05s linear, transform .2s;
    }

    .fake{ width:150px; }

    .real{
      width:220px;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
    }

    /* انفجار */
    .explode{
      animation:explode .45s ease forwards;
      pointer-events:none;
    }

    @keyframes explode{
      0%{
        transform:scale(1);
        opacity:1;
        filter:blur(0);
      }
      60%{
        transform:scale(1.6);
        opacity:.8;
      }
      100%{
        transform:scale(0);
        opacity:0;
        filter:blur(10px);
      }
    }

    #thanks{
      display:none;
      text-align:center;
    }

    .thanks-title{
      font-size:36px;
      font-weight:800;
      margin-top:80px;
    }

    .team{
      margin-top:16px;
      font-size:20px;
      line-height:2;
      color:#eef2ff;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- Survey -->
  <div class="card" id="survey">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="title">ما مدى رضاك عن الورشة ؟</div>
    <div class="subtitle">ورشة UI/UX وبرنامج Figma ✨</div>

    <div class="options" id="optionsBox">

      <button class="btn fake">لا بأس</button>
      <button class="btn fake">جيد نوعًا ما</button>
      <button class="btn fake">ما استفدت</button>

      <button class="btn real" id="realBtn">
        أحلى سشن وأحلى ورشة ✨
      </button>

    </div>

  </div>

  <!-- Thanks -->
  <div class="card" id="thanks">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="thanks-title">شكرًا لكم 💜</div>

    <div class="team">
      Seba<br>
      Shatha<br>
      Aljawharah
    </div>

  </div>

</div>

<script>

const fakeButtons = document.querySelectorAll('.fake');
const optionsBox = document.getElementById('optionsBox');
const realBtn = document.getElementById('realBtn');

const clickCount = new Map();

// حركة عشوائية
function moveButton(btn){

  const maxX = optionsBox.clientWidth - btn.offsetWidth;
  const maxY = optionsBox.clientHeight - btn.offsetHeight - 120;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  btn.style.left = `${x}px`;
  btn.style.top = `${y}px`;
}

// انفجار
function explode(btn){
  btn.classList.add('explode');

  setTimeout(()=>{
    btn.remove();
  },450);
}

// التعامل مع الأزرار المزيفة
function handleFake(btn){

  let count = clickCount.get(btn) || 0;
  count++;

  clickCount.set(btn, count);

  if(count < 2){
    moveButton(btn);
  } else {
    explode(btn);
  }
}

// تشغيل أولي
fakeButtons.forEach(btn=>{

  moveButton(btn);

  ['mouseenter','mousemove','click','touchstart'].forEach(ev=>{
    btn.addEventListener(ev, (e)=>{
      e.preventDefault();
      handleFake(btn);
    });
  });

});

// زر الحقيقي
realBtn.addEventListener('click',()=>{

  document.getElementById('survey').style.display = 'none';
  document.getElementById('thanks').style.display = 'block';

});

</script>

</body>
</html>
